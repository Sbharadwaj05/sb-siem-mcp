version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # mcp 2.x renamed FastMCP to MCPServer; moving to it is a code
      # migration, not a version bump.
      - dependency-name: "mcp"
        versions: [">=2.0.0"]
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
